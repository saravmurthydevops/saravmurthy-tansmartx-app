version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: tansmartx-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tansmartx-frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tansmartx-backend
    environment:
      - PORT=5000
